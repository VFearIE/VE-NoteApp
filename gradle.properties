# ---- JVM (runner 有 7GB，Gradle 2.5GB + Kotlin daemon 1.5GB + 系统) ----
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1536m

# ---- 性能 ----
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=false

# ---- Kotlin / KSP ----
kotlin.incremental=true
ksp.incremental=true
# Room 2.6.1 不支持 KSP2（其 KSP 处理器会抛 "unexpected jvm signature V"）；
# KSP2 支持自 Room 2.7.0 起才提供。必须保持 false，否则 kspDebugKotlin 必失败。
# 对本地增量构建性能影响可忽略。
ksp.useKSP2=false

# ---- Android ----
android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true
kotlin.code.style=official
